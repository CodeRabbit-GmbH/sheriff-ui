@if (!collapsed()) {
  <div
    class="card bg-base-100 border border-base-300 min-h-0"
    [class.flex-1]="matrixCollapsed()"
    [class.h-[350px]]="!matrixCollapsed()"
    [class.shrink-0]="!matrixCollapsed()"
  >
    <div class="card-body p-3 min-h-0 flex flex-col h-full">
      <div class="flex items-center justify-between pb-2 border-b border-base-300">
        <h2 class="card-title text-sm">Module Chart</h2>
        <div class="join">
          <button class="btn btn-xs btn-ghost btn-square join-item" (click)="fit.emit()" title="Fit to view">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
          </button>
          <button class="btn btn-xs btn-ghost btn-square join-item" (click)="refresh.emit()" title="Refresh">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          <button class="btn btn-xs btn-ghost btn-square join-item" (click)="toggleCollapsed.emit()" title="Minimize chart">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
      <div
        data-testid="manual-graph-dropzone"
        class="flex-1 min-h-0 overflow-hidden relative h-full"
        [class.ring-2]="draggingTag()"
        [class.ring-primary]="draggingTag()"
        (drop)="onDrop($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
      >
        <app-org-chart-diagram
          class="w-full h-full block"
          [tree]="tree()"
          [expandDepth]="1"
          [config]="chartConfig()"
          [targetModules]="targetModules()"
          [showToolbar]="false"
          [showBorder]="false"
          (selectedIdChange)="selectionChange.emit($event)"
          (tagRemove)="tagRemove.emit($event)"
        ></app-org-chart-diagram>
        @if (draggingTag() && !isOverDropZone()) {
          <div class="absolute inset-0 bg-primary/10 pointer-events-none flex items-center justify-center">
            <span class="badge badge-primary">Drop "{{ draggingTag() }}" here</span>
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <!-- Collapsed Module Chart bar -->
  <div class="card bg-base-100 border border-base-300 shrink-0">
    <div class="card-body p-2 flex-row items-center justify-between">
      <h2 class="text-sm font-medium">Module Chart</h2>
      <button
        class="btn btn-xs btn-ghost btn-square"
        (click)="toggleCollapsed.emit()"
        title="Expand chart"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </div>
}
